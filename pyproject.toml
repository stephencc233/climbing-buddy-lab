[project]
name = "climbing-buddy-lab"
version = "0.1.0"
description = "攀岩训练伙伴（原型）：记录室内攀岩训练并按周统计完攀率"
readme = "README.md"
authors = [
    { name = "stephen", email = "53896956+stephencc233@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
climbing-buddy-lab = "climbing_buddy_lab.entry:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.uv]
required-version = ">=0.13.0"

[tool.ruff]
# target-version 不写：Ruff 从 [project].requires-python（>=3.14）推断，版本只在一处维护
# line-length 不写：默认 88（与 Black 一致）

[tool.ruff.lint]
# 不写 select：采用 Ruff 默认规则集（0.17.0 为 407 条），决定见 B9《Ruff 配置说明》。
# Ruff 的确切版本由 uv.lock 锁定；升级 Ruff 单独提 PR（uv lock --upgrade-package ruff），
# 新版本默认规则的变化会在那个 PR 的检查结果里暴露，逐条处理后再合并。

[tool.ruff.format]
line-ending = "lf"  # 与 .editorconfig、.gitattributes 一致

[tool.pytest]
# pytest 9.0 起支持的原生 TOML 表（旧写法 [tool.pytest.ini_options] 的值是 INI 字符串）
minversion = "9.0"
testpaths = ["tests"]                 # 不带路径运行 pytest 时，只在 tests/ 下收集
addopts = ["-ra", "--strict-markers"] # -ra：末尾汇总非通过的结果；拼错的标记（如 parametrise）直接报错

[tool.coverage.run]
source = ["climbing_buddy_lab"]  # 只统计自己的包（按导入名找到 src/ 下的源码），从没被导入的文件也会列出
branch = true                    # 分支覆盖：if 的“是 / 否”两条路都走过才算覆盖

[tool.coverage.report]
show_missing = true              # 列出没执行到的行号

[tool.pyright]
# 类型检查配置：VS Code 里的 Pylance 和命令行 pyright 都读这一节，口径一致。
# 写在项目配置里后，个人 VS Code 设置里的 python.analysis.typeCheckingMode 不再生效（项目优先）
include = ["src", "tests"]      # 只查项目代码；scratch/ 等本地目录不在命令行检查范围内
typeCheckingMode = "standard"   # pyright 的默认档；Pylance 默认是 off（什么都不查）。basic 与 standard 的差别见 B10 类型检查一节
